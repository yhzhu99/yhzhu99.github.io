<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yinghao Zhu (朱英豪)</title>
    <meta
      name="description"
      content="Yinghao Zhu (朱英豪) is a PhD student at The University of Hong Kong focusing on AI for Healthcare research."
    />
    <meta name="author" content="Yinghao Zhu" />
    <meta name="theme-color" content="#005bac" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const dark = stored === "dark" || (stored !== "light" && prefersDark);
          const root = document.documentElement;

          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#121214" : "#005bac");
        } catch {
          // Ignore storage/scripting edge cases; the app applies the theme again.
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/assets/hku-crest.svg" />
    <link rel="icon" href="/assets/favicon.ico" sizes="48x48" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/hku-apple-touch-icon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
